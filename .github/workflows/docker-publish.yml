name: Build and publish Docker image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$cargo_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches Cargo.toml version ${cargo_version}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pulls back what was just pushed and starts it, per architecture.
      - name: Smoke test the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          expected=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          index=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")

          for platform in linux/amd64 linux/arm64; do
            echo "::group::smoke test ${platform}"

            # Run each platform by its own manifest digest, not the index
            # digest every platform shares. The image store is keyed by
            # repo@digest and holds one platform per key, so pulling a second
            # architecture under the index digest fails with "cannot overwrite
            # digest" once the first has claimed it.
            digest=$(printf '%s' "$index" | jq -r --arg p "$platform" '
              .manifests[]
              | select(.platform.os + "/" + .platform.architecture == $p)
              | .digest')
            if [ -z "$digest" ]; then
              echo "::error::published image has no ${platform} manifest"
              exit 1
            fi
            ref="${IMAGE}@${digest}"
            echo "${platform} -> ${digest}"

            cid=$(docker run -d --platform "$platform" -p 8788:8788 \
              -e HYDRA_ADMIN_PASSWORD=smoke-test "$ref")

            health=""
            for _ in $(seq 1 60); do
              health=$(curl -fsS http://127.0.0.1:8788/health 2>/dev/null) && break
              health=""
              sleep 2
            done

            if [ -z "$health" ]; then
              echo "::error::${platform} image never answered on /health"
              docker logs "$cid" || true
              docker rm -f "$cid" >/dev/null 2>&1 || true
              exit 1
            fi

            echo "/health -> ${health}"
            reported=$(printf '%s' "$health" | jq -r .version)
            docker rm -f "$cid" >/dev/null 2>&1 || true
            docker rmi "$ref" >/dev/null 2>&1 || true

            if [ "$reported" != "$expected" ]; then
              echo "::error::${platform} image reports version ${reported}, expected ${expected}"
              exit 1
            fi

            echo "${platform} ok — hydra-server ${reported}"
            echo "::endgroup::"
          done
